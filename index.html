    <!-- Prevent Theme Flash -->
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var queryTheme = params.get('theme');
          if (queryTheme === 'dark' || queryTheme === 'light') {
            localStorage.setItem('nexis_theme', queryTheme);
          }
          var saved = localStorage.getItem('nexis_theme');
          var isDark = saved ? saved === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
