name: Nexis Tech CI/CD

on:
  push:
    branches: [main, feat/polish-motion-deploy]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Run Verification & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Lint Check
        run: npm run lint

      - name: Run Unit & Integration Tests (11 tests)
        run: npm test

      - name: Build Production Client & Server Bundles
        run: npm run build

      - name: Deploy Frontend to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/polish-motion-deploy'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/client
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
