services:
  - type: web
    name: nexis-tech-web-app
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: nexis-sqlite-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SQLITE_DB_PATH
        value: /app/data/nexis_consultations.sqlite
